name: Deploy cronopy

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: make check-format

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - run: make test

  publish:
    name: Publish to PyPI
    needs: [check-format, lint, test]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cronopy/
    permissions:
      contents: read
      id-token: write   # PyPI trusted publishing (OIDC), no API token needed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make build
      # --check-url skips files already on PyPI, so a pyproject.toml change
      # that does not bump the version is a no-op instead of a failure.
      - run: uv publish --check-url https://pypi.org/simple/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so release notes cover the whole range
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(uv version --short)"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, skipping."
            exit 0
          fi
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "cronopy $version" \
            --generate-notes
